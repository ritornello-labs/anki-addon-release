name: Release

# Publishes to PyPI when a version tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Uses PyPI Trusted Publishing (OIDC) -- no API token / secret is stored. See the
# "Releasing" section of the README for the one-time PyPI publisher setup.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check publication before building
        env:
          PYTHONPATH: src
          PUBLICATION_BASE_REF: refs/remotes/origin/${{ github.event.repository.default_branch }}
        run: |
          if ! python3 -m anki_addon_release.publication --ci >/dev/null 2>&1; then
            echo "Publication check failed. Run the checker locally for details."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify tag matches project version
        run: |
          VERSION="$(uv version --short 2>/dev/null || grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG project_version=$VERSION"
          test "$VERSION" = "$TAG" || { echo "::error::tag '$TAG' does not match project version '$VERSION'"; exit 1; }

      - name: Build sdist and wheel
        run: uv build

      - name: Check exact distribution bytes
        env:
          PYTHONPATH: src
        run: |
          for artifact in dist/*; do
            if ! python3 -m anki_addon_release.publication --artifact "$artifact" >/dev/null 2>&1; then
              echo 'Distribution publication check failed. Run the checker locally for details.'
              exit 1
            fi
          done

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anki-addon-release
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
