name: Shared publication gate
on:
  workflow_call:
    inputs:
      tool_ref:
        description: Reviewed immutable checker commit; pin alongside the workflow reference
        required: true
        type: string
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ritornello-labs/anki-addon-release
          ref: ${{ inputs.tool_ref }}
          path: .publication-tool
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public tree and incoming history
        env:
          PYTHONPATH: .publication-tool/src
          PUBLICATION_BASE_REF: refs/remotes/origin/${{ github.event.repository.default_branch }}
        run: |
          if ! python -m anki_addon_release.publication --ci >/dev/null 2>&1; then
            echo 'Publication check failed. Run the checker locally for details.'
            exit 1
          fi
          echo 'Publication checks passed.'
