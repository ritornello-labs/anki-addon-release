name: Publication checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public tree and incoming history
        env:
          PYTHONPATH: src
          PUBLICATION_BASE_REF: refs/remotes/origin/${{ github.event.repository.default_branch }}
        run: |
          if ! python -m anki_addon_release.publication --ci >/dev/null 2>&1; then
            echo 'Publication check failed. Run the checker locally for details.'
            exit 1
          fi
          echo 'Publication checks passed.'
      - name: Exercise publication guards and release helpers
        env:
          PYTHONPATH: src
        run: |
          if ! python -m unittest discover -s tests -q >/dev/null 2>&1; then
            echo 'Regression checks failed. Run tests locally for details.'
            exit 1
          fi
          echo 'Regression checks passed.'
